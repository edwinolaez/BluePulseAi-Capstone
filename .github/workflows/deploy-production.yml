# deploy-production.yml — Manual Production Deployment to Vercel + Railway
#
# Owner: Edwin (CI/CD) — only Edwin can approve this workflow
# Trigger: Manual only (workflow_dispatch). Production is NEVER deployed automatically.
#
# Two-layer protection before anything reaches production:
#   1. Typed confirmation: the deployer must type "DEPLOY" in the dispatch form.
#      Prevents accidental triggers from the GitHub Actions UI.
#   2. GitHub Environments approval: Edwin must click "Approve" in the
#      GitHub UI before the deploy job starts (configured under
#      Settings → Environments → production → Required reviewers).
#
# Always deploy from the `main` branch — never from feature or develop branches.
# Run this workflow only AFTER: CI is green on main, staging has been validated,
# and M4/M5 sign-off has been received.

name: Deploy — Production

on:
  # Manual dispatch only — no automatic production deploys under any circumstances.
  # The `confirm` input is a human-readable safety gate to prevent UI mis-clicks.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm production release"
        required: true
        default: ""

jobs:
  # Gate check runs first and fails fast if the confirmation text is wrong.
  # This stops the deployment before any expensive steps run.
  gate-check:
    name: "Production Gate Check"
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Deployment aborted — type DEPLOY in the confirm field to proceed"
            exit 1
          fi
          echo "Gate check passed — proceeding to production deploy"

  deploy-production:
    name: "Deploy to Vercel Production"
    runs-on: ubuntu-latest
    needs: gate-check  # Only runs if the gate-check job succeeded
    # `environment: production` requires Edwin's manual click-to-approve in
    # GitHub → Settings → Environments → production before this job starts.
    # This is a second human gate on top of the typed confirmation above.
    environment: production
    steps:
      # Always check out `main` — production must only ever come from main,
      # never from a feature branch or develop.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Vercel CLI
        run: npm install -g vercel

      # `--prod` deploys to the production Vercel alias (the public URL),
      # not a preview URL. RAILWAY_PROD_URL points to the production Railway
      # service (separate from the staging service used in deploy-staging.yml).
      - name: Deploy frontend to Vercel (production)
        working-directory: jasper-frontend
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.RAILWAY_PROD_URL }}
          NEXT_PUBLIC_ML_API_BASE_URL: ${{ secrets.ML_API_URL }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          ML_API_KEY: ${{ secrets.ML_API_KEY || secrets.NEXT_PUBLIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Production smoke test is STRICTER than staging: `exit 1` on failure
      # means the CI job is marked red and visible in the GitHub PR/commit view.
      # `--retry 5 --retry-delay 10` gives Railway up to 50 seconds — enough
      # for a cold start — before declaring the deploy failed.
      - name: Post-deploy smoke test
        run: |
          PROD_URL="${{ secrets.RAILWAY_PROD_URL }}"
          if [ -n "$PROD_URL" ]; then
            curl --fail --retry 5 --retry-delay 10 "$PROD_URL/health" \
              && echo "Production health check PASSED" \
              || (echo "CRITICAL: Production health check FAILED" && exit 1)
          else
            echo "RAILWAY_PROD_URL not set — skipping smoke test"
          fi
